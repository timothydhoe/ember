# ember-alight — palette v0.6

named: &named
  # base tones
  hearth:    &hearth    "#0B162D"
  chalk:     &chalk     "#FBF7F5"
  beacon:    &beacon    "#4BF0FC"

  # main colours
  ash:       &ash       "#A09998"
  coal:      &coal      "#0E1D39"
  alight:    &alight    "#C2FD12"
  flare:     &flare     "#F74C3F"
  kindling:  &kindling  "#E87042"
  verdigris: &verdigris "#47EB8E"
  foxfire:   &foxfire   "#2E8B57"
  spark:     &spark     "#F3FFFB"
  smolder:   &smolder   "#DB9A2F"
  pilot:     &pilot     "#3F53AB"
  dusk:      &dusk      "#3E279B"
  fuel:      &fuel      "#0C5678"
  ember-dark:  &ember-dark  "#992929"
  ember-light: &ember-light "#F9A851"

  # For legibility and flexibility
  cinder:     &cinder     "#0E0E18"
  bunsen:     &bunsen     "#985DE9"
  amethyst:   &amethyst   "#BB6FE2"
  phosphor:   &phosphor   "#67413C"
  smoke:      &smoke      "#222425"
  blaze:      &blaze      "#F3453F"
  witchlight: &witchlight "#FFFC99"

palette:
  name: ember
  background: *hearth
  foreground: *chalk
  selection:  *fuel
  cursor:     *verdigris
  bold:       *chalk

ansi:
  black:          *coal
  red:            *blaze
  green:          *verdigris
  yellow:         *kindling
  blue:           *pilot
  magenta:        *amethyst
  cyan:           *fuel
  white:          *spark
  bright_black:   *ash
  bright_red:     *flare
  bright_green:   *verdigris
  bright_yellow:  *alight
  bright_blue:    *dusk
  bright_magenta: *bunsen
  bright_cyan:    *beacon
  bright_white:   *chalk

font:
  family: JetBrains Mono
  style: Regular
  size: 16
  line_spacing: 1.1

window:
  background_opacity: 0.95
  background_blur: 0.40

semantic:
  error:    *flare
  warning:  *alight
  success:  *verdigris
  accent:   *alight
  muted:    *ash
  link:     *pilot
  tag:      *bunsen
  keyword:  *amethyst
  type:     *fuel
  comment:  *ash

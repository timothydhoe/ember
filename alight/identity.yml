# ember — identity v0.1
#
# Brand elements alight.yml doesn't own: typography intent, logo references, and which accent color each tool uses. `alight.yml` stays scoped to colours only.

typography:
  logo:
    family: "Yumex Script"
    tracking: -9%
  programme_name:
    family: "Yumex"
    tracking: -9%

assets:
  logo_svg: assets/logo.svg

brand:
  ember:
    gradient: [ember-dark, ember-light]

tools:
  wildfire:
    color: blaze
